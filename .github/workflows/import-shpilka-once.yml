name: Import Shpilka realizacie (one time)
on:
  push:
    paths:
      - '.github/workflows/import-shpilka-once.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved portfolio export
        env:
          SOURCE_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IjWhW2MxGogvbOl1xNEpiTR44b/4fe17d9a-7a39-46e4-bb4e-6e9f74542687.json"
        run: |
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$SOURCE_URL" --output /tmp/shpilka-portfolio.json
      - name: Build 5 projects and photo files
        run: |
          python3 - <<'PY'
          import json, base64, pathlib
          source=json.loads(pathlib.Path('/tmp/shpilka-portfolio.json').read_text(encoding='utf-8'))
          raw=source['projects']
          assert len(raw)==5, 'Expected 5 projects'
          assert sum(len(x.get('photos',[])) for x in raw)==299, 'Expected 299 photographs'
          slugs=[
              'rekonstrukcia-3izbovy-ruzinov-74',
              'dom-sadrokarton-kazety-malovanie-100',
              'rekonstrukcia-2izbovy-ruzinov-52',
              'sadrokarton-kazetove-stropy-bajkalska',
              'rekonstrukcia-3izbovy-podunajske-biskupice-66',
          ]
          projects=[]
          for index, p in enumerate(raw):
              slug=slugs[index]
              photos=p.get('photos') or []
              images=[]
              cover=None
              for i,photo in enumerate(photos,1):
                  prefix,b64=photo['data'].split(',',1)
                  ext='.png' if 'png' in prefix.lower() else '.webp' if 'webp' in prefix.lower() else '.jpg'
                  path=pathlib.Path('realizacie/foto') / slug / (f'{i:03d}'+ext)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  data=base64.b64decode(b64,validate=True)
                  assert len(data)>50, f'Empty image: {path}'
                  path.write_bytes(data)
                  url='/'+path.as_posix()
                  images.append({'src':url,'stage':'Fotogaléria','original':photo.get('name','')})
                  if photo.get('id')==p.get('cover'): cover=url
              if not cover and images:cover=images[0]['src']
              description=(p.get('description') or '').strip()
              if index==1:
                  description=(
                    'Realizácia sadrokartónových podhľadov a kazetových stropov v rodinnom dome '
                    's podlahovou plochou 100 m² v Bratislavskom kraji.\n\n'
                    'Práce zahŕňali montáž konštrukcií sadrokartónových podhľadov, opláštenie, '
                    'tmelenie a brúsenie spojov, montáž kazetových stropov, lokálne opravy '
                    'sadrových omietok, prípravu povrchov a kompletné maľovanie stien a stropov '
                    'v celom dome.\n\n'
                    'Rozsah realizovaných prác\n\n'
                    '1. Sadrokartónové a kazetové stropy\n'
                    'Montáž kovových konštrukcií a sadrokartónových dosiek.\n'
                    'Tmelenie spojov, brúsenie a príprava povrchov.\n'
                    'Montáž nosných roštov a osadenie kaziet.\n\n'
                    '2. Príprava povrchov\n'
                    'Lokálne opravy sadrových omietok, vyrovnanie a príprava povrchov.\n'
                    'Penetrácia stien a stropov.\n\n'
                    '3. Maliarske práce\n'
                    'Maľovanie stien a stropov v celom dome a finálne dokončenie interiéru.\n\n'
                    'Výsledkom sú dokončené sadrokartónové a kazetové stropy a vymaľovaný interiér.'
                  )
              duration=str(p.get('duration') or '').strip()
              if index==2 and duration=='5':duration='5 týždňov'
              location=(p.get('location') or '').strip()
              if location.startswith('Lokalita:'):location=location.split(':',1)[1].strip()
              area=str(p.get('area') or '').strip()
              if area and not area.endswith('m²'):area+=' m²'
              projects.append({
                  'id':slug,
                  'title':p['title'],
                  'location':location,
                  'type':p.get('type') or 'Iné',
                  'area':area,
                  'duration':duration,
                  'description':description,
                  'result':'',
                  'services':p.get('work') or [],
                  'cover':cover or '',
                  'images':images,
              })
              print(f'{index+1}: {slug}: {len(images)} photos')
          assert len({p['id'] for p in projects})==5
          assert sum(len(p['images']) for p in projects)==299
          output=pathlib.Path('realizacie/projects.js')
          output.write_text('window.SHPILKA_PROJECTS = '+json.dumps(list(reversed(projects)),ensure_ascii=False,indent=2)+';\n',encoding='utf-8')
          print('Project index generated:',output.stat().st_size,'bytes')
          PY
      - name: Commit portfolio assets and data
        run: |
          git config user.name "Shpilka Portfolio Import"
          git config user.email "actions@users.noreply.github.com"
          git add realizacie/projects.js realizacie/foto/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish 5 Shpilka realizacie with 299 photos"
          git push origin HEAD:main
