<!DOCTYPE html>
<html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realizácie – SHPILKA | Rekonštrukcie Bratislava</title>
<meta name="description" content="Pozrite si skutočné realizácie SHPILKA s. r. o. v Bratislave a okolí.">
<link rel="canonical" href="https://shpilka.sk/realizacie/"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/site.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#020617;color:#e2e8f0}a{text-decoration:none;color:inherit}.nav{padding:14px 20px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08)}.nav a{color:#94a3b8}.nav .active,.nav a:hover{color:#facc15}.hero{text-align:center;padding:64px 20px 34px}.hero h1{font-size:clamp(32px,5vw,48px);margin:0 0 10px;color:#fff}.hero h1 span{color:#facc15}.hero p{color:#94a3b8}.grid{max-width:1050px;margin:auto;padding:20px 20px 70px;display:grid;gap:20px}.project{display:grid;grid-template-columns:minmax(280px,1.15fr) 1fr;background:#07101f;border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;transition:.25s}.project:hover{transform:translateY(-3px);border-color:rgba(250,204,21,.28)}.project img{width:100%;height:100%;min-height:300px;object-fit:cover;display:block}.body{padding:30px}.meta{color:#facc15;font-size:13px;margin-bottom:10px}h2{color:#fff;font-size:28px;margin:0 0 14px}.body p{color:#aeb9c9;line-height:1.7}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chips span{font-size:12px;padding:7px 10px;border:1px solid rgba(250,204,21,.22);border-radius:999px;color:#e6c857}.btn{display:inline-block;margin-top:8px;padding:12px 18px;background:linear-gradient(135deg,#d4af37,#facc15);color:#020617;border-radius:9px;font-weight:700}@media(max-width:760px){.project{grid-template-columns:1fr}.project img{min-height:240px;aspect-ratio:4/3}}</style></head>
<body><nav class="nav"><a href="/">Domov</a><a class="active" href="/realizacie/">Realizácie</a><a href="/dopyt/">Cenová ponuka</a><a href="/#kontakt">Kontakt</a></nav>
<section class="hero"><h1>Naše <span>realizácie</span></h1><p>Skutočné projekty, priebeh prác a výsledky.</p></section>
<main id="projects" class="grid"></main>
<script src="/realizacie/projects.js"></script>
<script>
(function(){
 const root=document.getElementById('projects');
 const ps=(window.SHPILKA_PROJECTS||[]).slice().reverse();
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const projectUrl=p=>p.url||('/realizacie/projekt/?id='+encodeURIComponent(p.id));
 if(!ps.length){root.innerHTML='<p style="color:#94a3b8">Realizácie pripravujeme.</p>';return;}
 root.innerHTML=ps.map(p=>{
   const meta=[p.location,p.area,p.duration].filter(Boolean).map(esc).join(' · ');
   const chips=(p.services||[]).slice(0,4).map(s=>`<span>${esc(s)}</span>`).join('');
   return `<article class="project"><a href="${projectUrl(p)}"><img loading="lazy" src="${esc(p.cover)}" alt="${esc(p.title)}"></a><div class="body"><div class="meta">${meta}</div><h2>${esc(p.title)}</h2><p>${esc(p.description||'')}</p><div class="chips">${chips}</div><a class="btn" href="${projectUrl(p)}">Pozrieť realizáciu →</a></div></article>`;
 }).join('');
})();
</script>
<script src="/assets/site.js"></script></body></html>
