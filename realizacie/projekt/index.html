<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realizácia – SHPILKA</title><meta name="robots" content="index,follow"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/site.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:#020617;color:#e2e8f0}a{text-decoration:none;color:inherit}.nav{padding:14px 20px;display:flex;justify-content:center;gap:30px;border-bottom:1px solid rgba(255,255,255,.07)}.nav a{color:#94a3b8;font-size:14px}.wrap{max-width:1050px;margin:auto;padding:50px 20px 70px}.back{font-size:13px;color:#facc15}.head{margin:24px 0 30px}.head .meta{color:#facc15;font-size:13px;margin-bottom:8px}.head h1{font-size:clamp(30px,5vw,46px);color:#fff;margin-bottom:12px}.head p{max-width:760px;color:#94a3b8;line-height:1.7}.services{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.services span{font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.2);color:#d4af37}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gallery img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.cta{margin-top:40px;padding:30px;border-radius:16px;border:1px solid rgba(250,204,21,.16);background:rgba(250,204,21,.05)}.cta h2{color:#fff;margin-bottom:8px}.cta p{color:#94a3b8;margin-bottom:18px}.btn{display:inline-block;padding:12px 20px;background:linear-gradient(135deg,#d4af37,#facc15);color:#020617;border-radius:9px;font-weight:700}@media(max-width:650px){.gallery{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="/">Domov</a><a href="/realizacie/">Realizácie</a><a href="/dopyt/">Cenová ponuka</a></nav><main class="wrap"><a class="back" href="/realizacie/">← Všetky realizácie</a><div id="project"></div></main><script src="/realizacie/projects.js"></script><script>const id=new URLSearchParams(location.search).get('id');const p=(window.SHPILKA_PROJECTS||[]).find(x=>x.id===id);const el=document.getElementById('project');if(!p){el.innerHTML='<div class="head"><h1>Projekt sa nenašiel</h1><p>Vráťte sa na zoznam realizácií.</p></div>';}else{document.title=p.title+' – SHPILKA';el.innerHTML=`<section class="head"><div class="meta">${p.location} · ${p.type}</div><h1>${p.title}</h1><p>${p.description}</p><div class="services">${(p.services||[]).map(s=>`<span>${s}</span>`).join('')}</div></section><div class="gallery">${(p.images||[]).map(src=>`<img src="${src}" alt="${p.title}">`).join('')}</div><section class="cta"><h2>Chcete podobnú realizáciu?</h2><p>Pošlite nám informácie o vašom projekte a pripravíme cenovú ponuku.</p><a class="btn" href="/dopyt/">Nezáväzný dopyt</a></section>`;}</script><script src="/assets/site.js"></script></body></html>
