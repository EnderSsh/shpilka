<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realizácia – SHPILKA</title><meta name="robots" content="index,follow"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/site.css"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:#020617;color:#e2e8f0}a{text-decoration:none;color:inherit}.nav{padding:14px 20px;display:flex;justify-content:center;gap:30px;border-bottom:1px solid rgba(255,255,255,.07)}.nav a{color:#94a3b8;font-size:14px}.wrap{max-width:1100px;margin:auto;padding:50px 20px 70px}.back{font-size:13px;color:#facc15}.head{margin:24px 0 30px}.head .meta{color:#facc15;font-size:13px;margin-bottom:8px}.head h1{font-size:clamp(30px,5vw,46px);color:#fff;margin-bottom:12px}.head p{max-width:820px;color:#b3bdcb;line-height:1.75}.services{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.services span{font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.2);color:#e6c857}.info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 38px}.box{padding:20px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#07101f}.box h3{font-size:14px;color:#facc15;margin-bottom:7px}.box p{font-size:14px;line-height:1.65;color:#aeb9c9}.stage{margin:34px 0}.stage h2{color:#fff;font-size:22px;margin-bottom:14px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#0b1220}.cta{margin-top:44px;padding:30px;border-radius:16px;border:1px solid rgba(250,204,21,.16);background:rgba(250,204,21,.05)}.cta h2{color:#fff;margin-bottom:8px}.cta p{color:#94a3b8;margin-bottom:18px}.btn{display:inline-block;padding:12px 20px;background:linear-gradient(135deg,#d4af37,#facc15);color:#020617;border-radius:9px;font-weight:700}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}.lightbox button{position:absolute;top:18px;right:22px;border:0;background:transparent;color:#fff;font-size:36px;cursor:pointer}@media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}}@media(max-width:480px){.gallery{grid-template-columns:1fr}}
</style></head><body><nav class="nav"><a href="/">Domov</a><a href="/realizacie/">Realizácie</a><a href="/dopyt/">Cenová ponuka</a></nav><main class="wrap"><a class="back" href="/realizacie/">← Všetky realizácie</a><div id="project"></div></main><div class="lightbox" id="lightbox"><button aria-label="Zavrieť">×</button><img alt="Detail realizácie"></div><script src="/realizacie/projects.js"></script><script>
const id=new URLSearchParams(location.search).get('id');const p=(window.SHPILKA_PROJECTS||[]).find(x=>x.id===id);const el=document.getElementById('project');
function normImages(list){return (list||[]).map(x=>typeof x==='string'?{src:x,stage:'Galéria'}:x)}
if(!p){el.innerHTML='<div class="head"><h1>Projekt sa nenašiel</h1><p>Vráťte sa na zoznam realizácií.</p></div>';}else{document.title=p.title+' – SHPILKA';const imgs=normImages(p.images);const groups={};imgs.forEach(i=>{const s=i.stage||'Galéria';(groups[s]||(groups[s]=[])).push(i)});const stages=Object.entries(groups).map(([name,arr])=>`<section class="stage"><h2>${name}</h2><div class="gallery">${arr.map(i=>`<img loading="lazy" src="${i.src}" alt="${p.title} – ${name}">`).join('')}</div></section>`).join('');el.innerHTML=`<section class="head"><div class="meta">${p.location} · ${p.type}</div><h1>${p.title}</h1><p>${p.description||''}</p><div class="services">${(p.services||[]).map(s=>`<span>${s}</span>`).join('')}</div></section>${(p.result||p.note)?`<div class="info">${p.result?`<div class="box"><h3>Výsledok</h3><p>${p.result}</p></div>`:''}${p.note?`<div class="box"><h3>Poznámka</h3><p>${p.note}</p></div>`:''}</div>`:''}${stages}<section class="cta"><h2>Plánujete podobnú rekonštrukciu?</h2><p>Pošlite nám základné informácie o projekte a dohodneme obhliadku a ďalší postup.</p><a class="btn" href="/dopyt/">Získať cenovú ponuku</a></section>`;}
const lb=document.getElementById('lightbox'),lbi=lb.querySelector('img');document.addEventListener('click',e=>{if(e.target.matches('.gallery img')){lbi.src=e.target.src;lb.classList.add('open')}if(e.target===lb||e.target===lb.querySelector('button'))lb.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
</script><script src="/assets/site.js"></script></body></html>
